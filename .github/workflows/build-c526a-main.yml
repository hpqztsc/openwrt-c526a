name: Build OpenWrt (HiWiFi C526A)

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    paths:
      - 'c526a-port/patches/**'
      - 'c526a-port/files/**'
      - 'c526a-port/config/**'
      - 'c526a-port/apply.sh'
      - '.github/workflows/build-c526a-main.yml'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openwrt-main
            repo: https://github.com/openwrt/openwrt
            branch: main
            port: main
            config: main
          - name: openwrt-24.10
            repo: https://github.com/openwrt/openwrt
            branch: openwrt-24.10
            port: 2410
            config: 2410
          - name: openwrt-25.12
            repo: https://github.com/openwrt/openwrt
            branch: openwrt-25.12
            port: 2512
            config: 2512
          - name: immortalwrt
            repo: https://github.com/immortalwrt/immortalwrt
            branch: master
            port: main
            config: immortalwrt
          - name: lede
            repo: https://github.com/coolsnowwolf/lede
            branch: master
            port: main
            config: lede

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -hT

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
          haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
          lrzsz mkisofs msmtp ninja-build p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo time uglifyjs unzip \
          upx-ucl vim wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone "$TZ"

    - name: Clone ${{ matrix.name }}
      run: |
        git clone --depth 1 -b ${{ matrix.branch }} ${{ matrix.repo }} openwrt
        cd openwrt && git log --oneline -1

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply C526A board support
      run: sh c526a-port/apply.sh ${{ matrix.port }} openwrt

    - name: Configure
      run: |
        cat c526a-port/config/common.config \
            c526a-port/config/${{ matrix.config }}.config > openwrt/.config
        cd openwrt
        make defconfig
        echo "--- selected target ---"
        grep -E '^CONFIG_TARGET_(ipq40xx|MULTI_PROFILE)|DEVICE_hiwifi' .config

    - name: Download packages
      run: cd openwrt && make download -j8

    - name: Compile firmware
      run: |
        cd openwrt
        echo "$(nproc) threads"
        make -j$(nproc) || make -j1 V=s
        echo "--- images ---"
        find bin/targets/ipq40xx -maxdepth 3 -type f -printf '%p %s\n'

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-c526a-${{ matrix.name }}
        path: |
          openwrt/bin/targets/ipq40xx/generic/*.ubi
          openwrt/bin/targets/ipq40xx/generic/*.bin
          openwrt/bin/targets/ipq40xx/generic/*.itb
          openwrt/bin/targets/ipq40xx/generic/*.tar
        if-no-files-found: error
